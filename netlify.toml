[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  external_node_modules = [
    "class-transformer/storage",
    "@nestjs/microservices",
    "@nestjs/websockets",
    "@grpc/grpc-js",
    "@grpc/proto-loader",
    "kafkajs",
    "mqtt",
    "amqplib",
    "amqp-connection-manager",
    "redis",
    "ioredis",
    "nats",
    "cache-manager",
    "class-validator",
    "class-transformer"
  ]

[[redirects]]
  from = "/api/auth/google/callback*"
  to = "/.netlify/functions/api/api/auth/google/callback:splat"
  status = 200

[[redirects]]
  from = "/api/api-docs*"
  to = "/.netlify/functions/api/api/api-docs:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api/:splat"
  status = 200